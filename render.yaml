services:
  - type: web
    name: armonialab
    env: docker
    plan: free
    region: oregon
    branch: main
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: armonialab-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database

databases:
  - name: armonialab-db
    databaseName: armonialab
    user: armonialab
    plan: free
    region: oregon
